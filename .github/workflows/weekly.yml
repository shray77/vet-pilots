name: weekly-tspulse

# Аномалия недели (TSPulse, 1M параметров, CPU) — понедельник 05:30 UTC,
# ДО LLM-дайджеста (06:00 UTC), чтобы дайджест успел прочитать свежий latest.json.
# Пушит tspulse/latest.json + tspulse/chart.png в main; ВетХаб читает raw.
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tspulse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tspulse-1

      - name: Cache TSPulse model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tspulse-r1-main

      - name: Install stack (CPU torch, granite-tsfm без CUDA-тянущих зависимостей)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.57.6,<6" datasets pandas scikit-learn einops Deprecated matplotlib
          pip install --no-deps granite-tsfm==0.3.10

      - name: Run TSPulse anomaly week
        run: python tspulse/run_weekly.py tspulse

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tspulse/latest.json tspulse/chart.png
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "tspulse: аномалия недели $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "retry $i"; sleep 10
          done
